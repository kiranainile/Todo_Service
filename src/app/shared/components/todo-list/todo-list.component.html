<mat-card>
    <ul class="list-group" *ngIf="TodoArr.length>0;else noTodos">
        <li class="list-group-item d-flex justify-content-between" *ngFor="let todo of TodoArr">
            <strong>{{todo.todoItem}}</strong>

            <div>
                <button 
                (click)="OnEdit(todo)"
                mat-mini-fab color="primary" class="mr-2">
                    <mat-icon>edit</mat-icon>
                </button>
                <button 
                (click)="Onremove(todo.todoid)"
                mat-mini-fab color="warn">
                    <mat-icon>delete</mat-icon>
                </button>
            </div>
        </li>
    </ul>
    <ng-template #noTodos>
        <p class="alert alert-info">No todos Availbale</p>
    </ng-template>
</mat-card>
