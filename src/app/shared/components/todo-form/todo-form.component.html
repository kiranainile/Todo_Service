
<mat-card>
    <form #todo="ngForm" (ngSubmit)="TodoAdd()">
        <div class="form-group">
            <input
            required
            ngModel
            #todoItem="ngModel"
            name="todoItem"
            type="text" class="form-control"  placeholder="title">
        </div>
        <button 
        [disabled]="todo.invalid"
        mat-raised-button color="primary" type="submit">Add button</button>
    </form>
</mat-card>
